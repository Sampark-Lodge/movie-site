<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --gold: #f5c518;
    --gold-dim: #b8921a;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --accent: #e8214a;
    --col-gap: 14px;
    --row-gap: 28px;
    --label-h: 32px;
    --header-h: 64px;
    --cat-h: 44px;
    --card-w: 170px;
    --card-h: 255px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;min-height:100vh;
    overflow-y:auto;overflow-x:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events:none;z-index:100;
  }

  /* HEADER - centered logo */
  header{
    position:sticky;top:0;left:0;right:0;height:var(--header-h);
    display:flex;align-items:center;justify-content:center;
    padding:0 32px;z-index:50;
    background:linear-gradient(180deg,rgba(10,10,15,0.98) 0%,rgba(10,10,15,0.85) 100%);
    backdrop-filter:blur(8px);
  }
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;}
  .logo-l{color:var(--bg);background:var(--gold);padding:2px 10px 1px;border-radius:3px;}
  .logo-r{color:#fff;margin-left:3px;}
  .logo-r span{color:var(--accent);}

  /* CATEGORY BAR - horizontally scrollable pill tabs */
  .cat-bar{
    position:sticky;top:var(--header-h);left:0;right:0;
    height:var(--cat-h);z-index:45;
    display:flex;align-items:center;
    padding:0 32px;gap:8px;
    background:var(--bg);
    border-bottom:1px solid rgba(255,255,255,0.04);
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;
  }
  .cat-bar::-webkit-scrollbar{display:none;}
  .cat-tab{
    flex-shrink:0;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
    color:var(--muted);background:transparent;
    border:1px solid rgba(255,255,255,0.08);border-radius:20px;
    padding:5px 18px;cursor:pointer;
    transition:all 0.2s;white-space:nowrap;
  }
  .cat-tab:hover{color:var(--gold);border-color:var(--gold-dim);}
  .cat-tab.active{background:var(--gold);color:#000;border-color:var(--gold);}

  /* MAIN CONTENT - streaming rows */
  main{
    padding:24px 32px 48px;
    display:flex;flex-direction:column;gap:var(--row-gap);
  }

  /* ROW SECTION */
  .row{
    position:relative;
  }
  .row-label{
    font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--text);margin-bottom:12px;
  }
  .row-track-wrap{position:relative;}
  .row-track-wrap::before,
  .row-track-wrap::after{
    content:'';position:absolute;top:0;bottom:8px;width:48px;z-index:5;
    pointer-events:none;
  }
  .row-track-wrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent);z-index:5;}
  .row-track-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent);z-index:5;}
  .row-track{
    display:flex;gap:var(--col-gap);
    overflow-x:auto;overflow-y:hidden;
    padding-bottom:8px;
    scrollbar-width:none;cursor:grab;
  }
  .row-track::-webkit-scrollbar{display:none;}
  .row-track:active{cursor:grabbing;}

  /* MOVIE CARD */
  .card{
    flex-shrink:0;width:var(--card-w);height:var(--card-h);
    border-radius:8px;overflow:hidden;position:relative;cursor:pointer;
    scroll-snap-align:start;
    transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),
               box-shadow 0.3s,
               z-index 0s;
    will-change:transform;
  }
  .card:hover{
    transform:translateY(-12px) scale(1.06);
    box-shadow:0 32px 64px rgba(0,0,0,0.7);
    z-index:10;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-info{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(0deg,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0) 60%);
    padding:14px 12px 12px;
  }
  .card-title{font-size:11px;font-weight:700;color:#fff;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-rating{display:flex;align-items:center;gap:4px;margin-top:5px;}
  .card-rating .star{color:var(--gold);font-size:10px;}
  .card-rating span{font-size:11px;font-weight:700;color:var(--gold);}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(12px);
    display:none;align-items:center;justify-content:center;
    padding:32px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);border-radius:16px;
    max-width:640px;width:100%;max-height:80vh;overflow-y:auto;
    padding:32px;position:relative;
    border:1px solid rgba(245,197,24,0.1);
    animation:modalIn 0.3s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal-close{
    position:absolute;top:16px;right:16px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.1);border:none;color:#fff;
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background 0.2s;
  }
  .modal-close:hover{background:rgba(255,255,255,0.2);}
  .modal h2{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;color:#fff;margin-bottom:8px;}
  .modal .meta{display:flex;gap:16px;margin-bottom:16px;}
  .modal .meta span{font-size:13px;color:var(--muted);}
  .modal .meta .big-star{color:var(--gold);font-size:18px;}
  .modal p{color:rgba(255,255,255,0.7);font-size:14px;line-height:1.6;}
  .modal .modal-poster{
    width:100%;height:200px;border-radius:10px;margin-bottom:20px;
    object-fit:cover;
  }
  .modal .rate-area{
    display:flex;gap:8px;margin-top:16px;
    flex-direction:row-reverse;justify-content:flex-end;
  }
  .modal .rate-area button{
    background:none;border:none;color:rgba(255,255,255,0.15);
    font-size:28px;cursor:pointer;transition:color 0.2s;
  }
  .modal .rate-area button:hover,
  .modal .rate-area button:hover ~ button,
  .modal .rate-area:not(:hover) button.active ~ button,
  .modal .rate-area:not(:hover) button.active{color:var(--gold);}

/* YouTube Background Player - always playing */
  #ytPlayerContainer{
    position:fixed;bottom:16px;right:16px;width:200px;height:113px;
    border-radius:8px;overflow:hidden;z-index:200;
    box-shadow:0 8px 32px rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,0.08);
  }
  #ytPlayerContainer iframe{width:100%;height:100%;border:none;pointer-events:none;}
  #ytPlayerContainer .yt-label{
    position:absolute;bottom:4px;left:6px;
    font-size:7px;color:rgba(255,255,255,0.4);letter-spacing:0.5px;
    text-shadow:0 1px 3px rgba(0,0,0,0.8);pointer-events:none;
  }
  #ytPlayerContainer .yt-badge{
    position:absolute;top:4px;right:4px;
    background:rgba(255,0,0,0.85);color:#fff;
    font-size:7px;padding:1px 5px;border-radius:3px;
    letter-spacing:0.5px;pointer-events:none;
  }

/* STATUS MSG */
.status-msg{
    position:fixed;bottom:20px;right:32px;
    font-size:11px;color:rgba(255,255,255,0.2);
    z-index:1;pointer-events:none;
  }
</style>

function render() {

}

function generatePoster(title, genre, bgColor, hue) {
  const lines = wrapText(title, 16);
  const textLines = lines.map((l,i) =>
    `<text x="85" y="${140 + i*20}" text-anchor="middle" font-size="14" font-weight="800" fill="white" font-family="Georgia,serif" opacity="0.95">${l}</text>`
  ).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="170" height="255" viewBox="0 0 170 255">
    <defs><linearGradient id="g${hue}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${bgColor}"/><stop offset="100%" stop-color="hsl(${hue},30%,8%)"/></linearGradient><linearGradient id="o${hue}" x1="0%" y1="40%" x2="0%" y2="100%"><stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.85)"/></linearGradient></defs>
    <rect width="170" height="255" fill="url(#g${hue})"/>
    <circle cx="140" cy="30" r="55" fill="hsl(${hue},40%,20%)" opacity="0.3"/>
    <circle cx="20" cy="215" r="65" fill="hsl(${(hue+180)%360},30%,15%)" opacity="0.2"/>
    <rect x="0" y="65" width="5" height="85" fill="hsl(${hue},70%,55%)" opacity="0.6"/>
    <rect x="12" y="14" width="${genre.length*7+12}" height="20" rx="3" fill="hsl(${hue},60%,40%)" opacity="0.85"/>
    <text x="17" y="27" font-size="10" font-weight="700" fill="white" font-family="Arial" letter-spacing="1">${genre.toUpperCase()}</text>
    <rect width="170" height="255" fill="url(#o${hue})"/>
    ${textLines}
    <text x="85" y="${162}" text-anchor="middle" font-size="11" fill="hsl(${hue},60%,65%)" font-family="Arial">★ ${(hue%5+7)}.${(hue*7)%10}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function wrapText(text, max) {
  const w = text.split(' '); const lines = []; let cur = '';
  for(const c of w) {
    if((cur+' '+c).trim().length <= max){ cur=(cur+' '+c).trim(); }
    else { if(cur) lines.push(cur); cur=c; }
  }
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}

  content.innerHTML = `

        <div style="font-size:12px;color:var(--gold-dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px;">${genre}</div>
      </div>
    </div>
    <h2>${title}</h2>
    <div class="meta">
      <span>${year}</span>
      <span class="big-star">★</span>
      <span>${rating}</span>
      <span style="text-transform:uppercase;color:var(--gold-dim);letter-spacing:1px;font-size:11px;">${genre}</span>
    </div>
    <p>${title} is a ${genre.toLowerCase()} film released in ${year} with an IMDb rating of ${rating}/10. Rate this movie below!</p>
    <div class="rate-area">
      ${[5,4,3,2,1].map(i => `<button class="star-r-btn" data-r="${i}" onclick="setRating(this,${i})">★</button>`).join('')}
    </div>
    <div id="rateMsg" style="margin-top:12px;font-size:12px;color:var(--muted);"></div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {

function setRating(btn, r) {
  document.querySelectorAll('.star-r-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.r) <= r));
  document.getElementById('rateMsg').textContent = `You rated this ★ ${r}/5`;
}
