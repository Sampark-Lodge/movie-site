<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMDbovie - Movie Ratings</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --gold: #f5c518;
    --gold-dim: #b8921a;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --accent: #e8214a;
    --col-gap: 16px;
    --row-gap: 12px;
    --label-h: 30px;
    --header-h: 60px;
    --main-pad-v: 8px;
    --card-w: 140px;
    --card-h: 210px;
    --card-w-lg: 200px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events:none;z-index:100;
  }

  /* HEADER */
  header{
    position:fixed;top:0;left:0;right:0;height:60px;
    display:flex;align-items:center;
    padding:0 32px;z-index:50;
    background:linear-gradient(180deg,rgba(10,10,15,0.98) 0%,rgba(10,10,15,0) 100%);
  }
  .logo{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;}
  .logo-l{color:var(--bg);background:var(--gold);padding:2px 10px 1px;border-radius:3px;}
  .logo-r{color:#fff;margin-left:3px;}
  .logo-r span{color:var(--accent);}

  /* YOUTUBE CHANNEL BAR (gptoktha) */
  .yt-bar{
    position:fixed;top:60px;left:0;right:0;height:130px;z-index:40;
    background:rgba(10,10,15,0.95);
    border-bottom:1px solid rgba(245,197,24,0.1);
    display:flex;align-items:center;padding:0 32px;gap:16px;
    overflow:hidden;
  }
  .yt-bar .yt-label{
    font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--gold-dim);flex-shrink:0;white-space:nowrap;align-self:flex-start;margin-top:14px;
  }
  .yt-bar .yt-label .yt-icon{color:#ff0000;margin-right:4px;}
  .yt-bar .yt-scroll{
    display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;
    padding:4px 0;flex:1;align-items:center;
    scrollbar-width:none;
  }
  .yt-bar .yt-scroll::-webkit-scrollbar{display:none;}
  .yt-bar .yt-vid{
    flex-shrink:0;width:200px;height:113px;border-radius:6px;overflow:hidden;
    position:relative;background:#000;
    transition:transform 0.2s,box-shadow 0.2s;
    cursor:pointer;
  }
  .yt-bar .yt-vid:hover{transform:scale(1.04);box-shadow:0 0 16px rgba(255,0,0,0.3);}
  .yt-bar .yt-vid iframe{
    width:200px;height:113px;border:none;display:block;pointer-events:none;
  }
  .yt-bar .yt-vid img{
    width:200px;height:113px;object-fit:cover;display:block;
  }
  .yt-bar .yt-vid .mute-badge{
    position:absolute;top:4px;right:4px;
    background:rgba(0,0,0,0.75);color:#fff;
    font-size:8px;padding:2px 6px;border-radius:3px;
    pointer-events:none;
  }
  .yt-bar .yt-vid .channel-label{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(0deg,rgba(0,0,0,0.85),transparent);
    padding:6px 8px 4px;pointer-events:none;
  }
  .yt-bar .yt-vid .channel-label span{
    font-size:8px;color:rgba(255,255,255,0.7);letter-spacing:0.5px;
  }
  .yt-bar .play-indicator{
    position:absolute;top:4px;left:4px;
    background:rgba(255,0,0,0.9);color:#fff;
    font-size:7px;padding:2px 6px;border-radius:3px;
    pointer-events:none;
    letter-spacing:0.5px;
  }

  /* CATEGORY TABS */
  .cat-tabs{
    position:fixed;top:190px;left:0;right:0;height:36px;z-index:39;
    display:flex;align-items:center;gap:8px;
    padding:0 32px;
    background:linear-gradient(180deg,rgba(10,10,15,0.95),rgba(10,10,15,0));
  }
  .cat-tab{
    font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);background:transparent;
    border:1px solid rgba(255,255,255,0.08);border-radius:20px;
    padding:4px 16px;cursor:pointer;
    transition:all 0.2s;white-space:nowrap;
  }
  .cat-tab:hover,.cat-tab.active{color:var(--gold);border-color:var(--gold-dim);background:rgba(245,197,24,0.08);}
  .cat-tab.active{background:var(--gold);color:#000;border-color:var(--gold);}

  /* MAIN */
  main{
    position:fixed;
    top:226px;bottom:0;left:0;right:0;
    overflow:hidden;
    padding:8px 0 0 32px;
    display:flex;flex-direction:column;gap:var(--row-gap);
  }

  /* ROW */
  .row-section{flex-shrink:0;}
  .row-label{
    font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);height:var(--label-h);
    display:flex;align-items:center;gap:10px;padding-right:32px;
  }
  .row-label .count{
    font-size:10px;font-weight:400;color:rgba(255,255,255,0.15);
    font-family:monospace;
  }
  .row-label .arr-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.1);
    background:transparent;color:var(--muted);
    cursor:pointer;font-size:10px;transition:all 0.2s;
    margin-left:4px;
  }
  .row-label .arr-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(245,197,24,0.1);}
  .row-scroll{
    display:flex;gap:var(--col-gap);
    overflow-x:auto;overflow-y:hidden;
    padding-bottom:6px;padding-right:32px;
    scroll-snap-type:x mandatory;
    scrollbar-width:thin;
    scrollbar-color:rgba(245,197,24,0.3) transparent;
  }
  .row-scroll::-webkit-scrollbar{height:3px;}
  .row-scroll::-webkit-scrollbar-track{background:transparent;}
  .row-scroll::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px;}

  /* CARD */
  .card{
    flex-shrink:0;width:var(--card-w);height:var(--card-h);
    border-radius:10px;overflow:hidden;position:relative;cursor:pointer;
    scroll-snap-align:start;
    transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.3s;
    background:var(--card);
  }
  .card:hover{
    transform:translateY(-8px) scale(1.05);
    box-shadow:0 24px 48px rgba(0,0,0,0.6),0 0 0 1px rgba(245,197,24,0.25);
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;transition:filter 0.3s;}
  .card:hover img{filter:brightness(0.45) saturate(0.8);}
  .card-overlay{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(0deg,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0.4) 50%,transparent 100%);
    padding:14px 12px 10px;
  }
  .card-title{font-size:12px;font-weight:700;line-height:1.3;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{display:flex;align-items:center;gap:6px;margin-top:5px;}
  .card-meta .star{color:var(--gold);font-size:10px;}
  .card-meta .rating{font-size:11px;font-weight:700;color:var(--gold);}
  .card-meta .year{font-size:10px;color:var(--muted);margin-left:auto;}
  .card-rank{
    position:absolute;top:8px;left:8px;
    width:24px;height:24px;border-radius:50%;
    background:var(--gold);color:#000;
    font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    z-index:2;
  }
  .card-hover-info{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;
    opacity:0;transition:opacity 0.3s;padding:12px;
  }
  .card:hover .card-hover-info{opacity:1;}
  .card-hover-info .play-btn{
    width:44px;height:44px;border-radius:50%;
    background:var(--gold);display:flex;align-items:center;justify-content:center;
    color:#000;font-size:16px;transition:transform 0.2s;
  }
  .card-hover-info .play-btn:hover{transform:scale(1.15);}
  .card-hover-info .card-genre{
    font-size:9px;color:rgba(255,255,255,0.7);
    letter-spacing:1px;text-transform:uppercase;text-align:center;
  }
  .card .user-rating{
    position:absolute;bottom:50px;right:8px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    opacity:0;transition:opacity 0.3s;
  }
  .card:hover .user-rating{opacity:1;}
  .user-rating .star-btn{
    background:none;border:none;color:rgba(255,255,255,0.3);
    cursor:pointer;font-size:14px;transition:color 0.2s;padding:1px;
    line-height:1;
  }
  .user-rating .star-btn:hover,.user-rating .star-btn.active{color:var(--gold);}

  /* BADGES */
  .badge{
    display:inline-block;font-size:8px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;padding:2px 8px;border-radius:3px;margin-right:8px;
  }
  .badge-new{background:var(--accent);color:#fff;}
  .badge-top{background:var(--gold);color:#000;}
  .badge-hot{background:#ff6b35;color:#fff;}
  .badge-classic{background:#2a6f97;color:#fff;}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(12px);
    display:none;align-items:center;justify-content:center;
    padding:32px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);border-radius:16px;
    max-width:640px;width:100%;max-height:80vh;overflow-y:auto;
    padding:32px;position:relative;
    border:1px solid rgba(245,197,24,0.1);
    animation:modalIn 0.3s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal-close{
    position:absolute;top:16px;right:16px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.1);border:none;color:#fff;
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background 0.2s;
  }
  .modal-close:hover{background:rgba(255,255,255,0.2);}
  .modal h2{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;color:#fff;margin-bottom:8px;}
  .modal .meta{display:flex;gap:16px;margin-bottom:16px;}
  .modal .meta span{font-size:13px;color:var(--muted);}
  .modal .meta .big-star{color:var(--gold);font-size:18px;}
  .modal p{color:rgba(255,255,255,0.7);font-size:14px;line-height:1.6;}
  .modal .modal-poster{
    width:100%;height:200px;border-radius:10px;margin-bottom:20px;
    object-fit:cover;
  }
  .modal .rate-area{
    display:flex;gap:8px;margin-top:16px;
    flex-direction:row-reverse;justify-content:flex-end;
  }
  .modal .rate-area button{
    background:none;border:none;color:rgba(255,255,255,0.15);
    font-size:28px;cursor:pointer;transition:color 0.2s;
  }
  .modal .rate-area button:hover,
  .modal .rate-area button:hover ~ button,
  .modal .rate-area:not(:hover) button.active ~ button,
  .modal .rate-area:not(:hover) button.active{color:var(--gold);}

  /* FOOTER note */
  .status-msg{
    position:fixed;bottom:20px;right:32px;
    font-size:11px;color:rgba(255,255,255,0.2);
    z-index:1;pointer-events:none;
  }
</style>
</head>

// Remove exact dupes by title+year
const seen = new Set();
const UNIQUE_MOVIES = MOVIES.filter(m => {
  const key = m[0]+'|'+m[1];
  if(seen.has(key)) return false;
  seen.add(key);
  return true;
});

console.log(`Total unique movies: ${UNIQUE_MOVIES.length}`);

// ─── ROWS ───
const GENRE_MAP = {
  'all':'All','action':'Action','drama':'Drama','sci-fi':'Sci-Fi',
  'horror':'Horror','thriller':'Thriller','crime':'Crime',
  'comedy':'Comedy','animation':'Animation','mystery':'Mystery'
};

const ROW_DEFS = [
  { label:'Top Rated', icon:'★', filter: m => m[2] >= 9.0, badge:'top', cat:'all' },
  { label:'New Releases 2025', icon:'●', filter: m => m[1] >= 2025, badge:'new', cat:'all' },
  { label:'2024 Movies', icon:'▸', filter: m => m[1] == 2024 || m[1] == 2023, badge:'new', cat:'all' },
  { label:'Action Packed', icon:'⚡', filter: m => m[3]=='Action', badge:'hot', cat:'action' },
  { label:'Sci-Fi Wonders', icon:'◈', filter: m => m[3]=='Sci-Fi', badge:null, cat:'sci-fi' },
  { label:'Mind-Bending Thrillers', icon:'◉', filter: m => m[3]=='Thriller', badge:null, cat:'thriller' },
  { label:'Crime Stories', icon:'■', filter: m => m[3]=='Crime', badge:null, cat:'crime' },
  { label:'Laugh Out Loud', icon:'ϟ', filter: m => m[3]=='Comedy', badge:null, cat:'comedy' },
  { label:'Animation Magic', icon:'✦', filter: m => m[3]=='Animation', badge:null, cat:'animation' },
  { label:'Classic Cinema', icon:'◆', filter: m => m[1] < 1980 && m[2] >= 8.0, badge:'classic', cat:'all' },
];

const main = document.getElementById('main');
const statusMsg = document.getElementById('statusMsg');
statusMsg.textContent = `${UNIQUE_MOVIES.length} movies loaded`;

let currentFilter = 'all';

function renderRows(filter) {
  main.innerHTML = '';
  const mov = UNIQUE_MOVIES.filter(m => filter==='all' || m[3].toLowerCase()===filter);

  ROW_DEFS.forEach((row, ri) => {
    const rowMovies = mov.filter(row.filter);
    if(rowMovies.length < 3) return;

    const section = document.createElement('div');
    section.className = 'row-section';

    const label = document.createElement('div');
    label.className = 'row-label';
    let h = '';
    if(row.badge) h += `<span class="badge badge-${row.badge}">${row.badge==='top'?'Top':row.badge==='new'?'New':row.badge==='hot'?'Hot':'Classic'}</span>`;
    h += `${row.icon || ''} ${row.label}`;
    h += ` <span class="count">(${rowMovies.length})</span>`;
    h += `<button class="arr-btn" onclick="scrollRow(this,'prev')">◀</button>`;
    h += `<button class="arr-btn" onclick="scrollRow(this,'next')">▶</button>`;
    label.innerHTML = h;
    section.appendChild(label);

    const scroll = document.createElement('div');
    scroll.className = 'row-scroll';

    rowMovies.forEach((movie, ci) => {
      const [title, year, rating, genre, color] = movie;
      const card = document.createElement('div');
      card.className = 'card' + (ci === 0 && ri === 0 ? ' featured' : '');
      const hue = (ri * 97 + ci * 53) % 360;
      const svg = generatePoster(title, genre, color, hue);
      card.innerHTML = `
        <img src="${svg}" alt="${title}" loading="lazy">
        ${ci < 3 ? `<div class="card-rank">${ci+1}</div>` : ''}
        <div class="card-overlay">
          <div class="card-title">${title}</div>
          <div class="card-meta">
            <span class="star">★</span>
            <span class="rating">${rating}</span>
            <span class="year">${year}</span>
          </div>
        </div>
        <div class="card-hover-info">
          <div class="play-btn">▶</div>
          <div class="card-genre">${genre}</div>
          <div class="user-rating">
            <button class="star-btn" onclick="event.stopPropagation();rateMovie(this)">★</button>
          </div>
        </div>
      `;
      card.onclick = () => showModal(title, year, rating, genre, color, hue);
      scroll.appendChild(card);
    });

    section.appendChild(scroll);
    main.appendChild(section);
  });
}

function scrollRow(btn, dir) {
  const scroll = btn.closest('.row-section').querySelector('.row-scroll');
  const amount = 300;
  scroll.scrollBy({ left: dir==='next' ? amount : -amount, behavior:'smooth' });
}

function generatePoster(title, genre, bgColor, hue) {
  const lines = wrapText(title, 16);
  const textLines = lines.map((l,i) =>
    `<text x="80" y="${128 + i*18}" text-anchor="middle" font-size="13" font-weight="800" fill="white" font-family="Georgia,serif" opacity="0.95">${l}</text>`
  ).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="240" viewBox="0 0 160 240">
    <defs><linearGradient id="g${hue}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${bgColor}"/><stop offset="100%" stop-color="hsl(${hue},30%,8%)"/></linearGradient><linearGradient id="o${hue}" x1="0%" y1="40%" x2="0%" y2="100%"><stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.85)"/></linearGradient></defs>
    <rect width="160" height="240" fill="url(#g${hue})"/>
    <circle cx="130" cy="30" r="50" fill="hsl(${hue},40%,20%)" opacity="0.3"/>
    <circle cx="20" cy="200" r="60" fill="hsl(${(hue+180)%360},30%,15%)" opacity="0.2"/>
    <rect x="0" y="60" width="4" height="80" fill="hsl(${hue},70%,55%)" opacity="0.6"/>
    <rect x="10" y="12" width="${genre.length*7+10}" height="18" rx="3" fill="hsl(${hue},60%,40%)" opacity="0.85"/>
    <text x="15" y="24" font-size="9" font-weight="700" fill="white" font-family="Arial" letter-spacing="1">${genre.toUpperCase()}</text>
    <rect width="160" height="240" fill="url(#o${hue})"/>
    ${textLines}
    <text x="80" y="${152}" text-anchor="middle" font-size="10" fill="hsl(${hue},60%,65%)" font-family="Arial">★ ${hue%5+7}.${(hue*7)%10}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function wrapText(text, max) {
  const w = text.split(' '); const lines = []; let cur = '';
  for(const c of w) {
    if((cur+' '+c).trim().length <= max){ cur=(cur+' '+c).trim(); }
    else { if(cur) lines.push(cur); cur=c; }
  }
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}

// ─── MODAL ───
function showModal(title, year, rating, genre, color, hue) {
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div style="width:100%;height:200px;border-radius:10px;margin-bottom:20px;background:linear-gradient(135deg,${color},hsl(${hue},30%,12%));display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <div style="text-align:center;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:rgba(255,255,255,0.15);letter-spacing:4px;">CINEMA</div>
        <div style="font-size:12px;color:var(--gold-dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px;">${genre}</div>
      </div>
    </div>
    <h2>${title}</h2>
    <div class="meta">
      <span>${year}</span>
      <span class="big-star">★</span>
      <span>${rating}</span>
      <span style="text-transform:uppercase;color:var(--gold-dim);letter-spacing:1px;font-size:11px;">${genre}</span>
    </div>
    <p>${title} is a ${genre.toLowerCase()} film released in ${year} with an IMDb rating of ${rating}/10. Rate this movie below!</p>
    <div class="rate-area">
      ${[5,4,3,2,1].map(i => `<button class="star-r-btn" data-r="${i}" onclick="setRating(this,${i})">★</button>`).join('')}
    </div>
    <div id="rateMsg" style="margin-top:12px;font-size:12px;color:var(--muted);"></div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function setRating(btn, r) {
  document.querySelectorAll('.star-r-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.r) <= r));
  document.getElementById('rateMsg').textContent = `You rated this ★ ${r}/5`;
}

function rateMovie(btn) {
  btn.classList.toggle('active');
}

// ─── YOUTUBE THUMBNAIL CLICKS ───
document.querySelectorAll('.yt-thumb').forEach(el => {
  el.onclick = () => {
    window.open('https://www.youtube.com/watch?v=' + el.dataset.vid, '_blank');
  };
});

// ─── CATEGORY TABS ───
document.querySelectorAll('.cat-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.cat;
    renderRows(currentFilter);
  };
});

// ─── CLOSE MODAL ON OVERLAY CLICK ───
document.getElementById('modalOverlay').onclick = (e) => {
  if(e.target === document.getElementById('modalOverlay')) closeModal();
};

// ─── INJECT YOUTUBE PLAYER ON LOAD FOR RELIABLE AUTOPLAY ───
window.addEventListener("load", () => {
  const container = document.getElementById("ytVidPlayer");
  // Try minimal embed first - bare autoplay+mute, no extra params
  container.innerHTML += `
    <iframe
      src="https://www.youtube.com/embed/Iikttcr0DTo?autoplay=1&amp;mute=1"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  `;
});

// ─── INIT ───
renderRows('all');
